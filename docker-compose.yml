services:
  # 1. Nginx Reverse Proxy Service (Dung truoc toan bo he thong, nhan HTTP/HTTPS)
  reverse_proxy:
    image: nginx:alpine
    container_name: quiz_proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - quiz_network

  # 2. Frontend Web Service (Static HTML/CSS/JS phuc vu boi Nginx noi bo, khong expose port ra ngoai host)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz_frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    networks:
      - quiz_network

  # 3. Backend Node.js API Service (Chi trao doi noi bo voi Nginx qua port 5000, chay bang non-root user node)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz_backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-quiz_user}
      DB_PASSWORD: ${DB_PASSWORD:-quiz_secure_pass_2026}
      DB_NAME: ${DB_NAME:-quiz_system}
      JWT_SECRET: ${JWT_SECRET:-quiz_system_super_secret_jwt_key_2026}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz_network

  # 4. Database MySQL Service (Gioi han ket noi tren loopback 127.0.0.1 neu truy cap tu host)
  mysql:
    image: mysql:8.0
    container_name: quiz_mysql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-quiz_system}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - quiz_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 5. phpMyAdmin Database Management Service (Gioi han loopback 127.0.0.1 de khong cong khai ra mang ngoai)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: quiz_phpmyadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PMA_PORT:-8088}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quiz_network

  # 6. Prometheus Service (Thu thap Metrics tu Backend, cAdvisor, va chinh no)
  prometheus:
    image: prom/prometheus:latest
    container_name: quiz_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend
    networks:
      - quiz_network

  # 7. cAdvisor Service (Thu thap Metrics tai nguyen CPU, RAM, Network cua cac Docker containers)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: quiz_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - quiz_network

  # 8. Grafana Service (Truc quan hoa Metrics + Logs tap trung)
  grafana:
    image: grafana/grafana:latest
    container_name: quiz_grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - quiz_network

  # 9. Loki Service (Luu tru & danh chi muc Log tap trung)
  loki:
    image: grafana/loki:latest
    container_name: quiz_loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LOKI_PORT:-3101}:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - quiz_network

  # 10. Promtail Service (Doc Docker container logs va day ve Loki)
  promtail:
    image: grafana/promtail:latest
    container_name: quiz_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - quiz_network

networks:
  quiz_network:
    name: quiz_system_network
    driver: bridge

volumes:
  mysql_data:
    name: quiz_mysql_data
  prometheus_data:
    name: quiz_prometheus_data
  grafana_data:
    name: quiz_grafana_data
  loki_data:
    name: quiz_loki_data
