server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Thu thap logs cua tat ca cac container thong qua Docker daemon socket
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Trich xuat container name tu Docker label (bo dau '/' o dau ten)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Trich xuat compose service name (neu co)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # Gan nhan job co dinh
      - replacement: 'docker'
        target_label: 'job'
      # Bo qua container promtail de tranh spam loop
      - source_labels: ['container']
        regex: 'quiz_promtail'
        action: drop
